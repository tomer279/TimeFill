# Milestone 7.5 benchmark config (WP0 scaffolding; seed grid runs in WP7).
# Same protocols as bench_m3.yaml. Checkpoint under artifacts/m7_5/train/.
# seeds.mask / seeds.sample are lists for the WP7 grid; the M3 loader still
# expects scalars until WP7 — do not pass this file to run_m3_benchmark yet.

data:
  processed_dir: data/processed/m2
  checkpoint: artifacts/m7_5/train/checkpoints/best_score_net.eqx
  scaler: artifacts/m7_5/train/checkpoints/feature_scaler.npz
  split: test
  n_features: 6
  feature_names:
    - PM2.5
    - PM10
    - SO2
    - NO2
    - CO
    - O3
  seq_len: 64

protocols:
  mcar_rates:
    - 0.10
    - 0.30
    - 0.50
  block:
    enabled: true
    block_len: 8

sample:
  K_samples: 50
  solver_steps: 100

seeds:
  mask: [0, 1, 2]
  sample: [1, 2, 3]

methods:
  - timefill
  - locf
  - linear

baselines:
  edge_policy: train_feature_mean
  point_metrics: degenerate_k1
  point_k: 1

artifact_dir: artifacts/m7_5/bench

smoke:
  max_windows: null
  K_samples: 2
  solver_steps: 10
  split: val
