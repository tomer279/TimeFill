# Milestone 7.5 benchmark (WP7). Checkpoint under artifacts/m7_5/train/.
# Seed lists expand to a 3×3 Cartesian grid (Phase 3 run loop). Until that
# loop lands, run_m3_benchmark refuses len(seed_pairs) > 1. block.extra_lens
# are extension rows (not the frozen M3 grid).
# Use --real-config configs/real_m7_5.yaml.

data:
  processed_dir: data/processed/m2
  checkpoint: artifacts/m7_5/train/checkpoints/best_score_net.eqx
  scaler: artifacts/m7_5/train/checkpoints/feature_scaler.npz
  split: test
  n_features: 6
  feature_names:
    - PM2.5
    - PM10
    - SO2
    - NO2
    - CO
    - O3
  seq_len: 64

protocols:
  mcar_rates:
    - 0.10
    - 0.30
    - 0.50
  block:
    enabled: true
    block_len: 8
    extra_lens: [16]

sample:
  K_samples: 50
  solver_steps: 100
  diffusion_impl: diagonal
  point_estimate: median

seeds:
  mask: [0, 1, 2]
  sample: [1, 2, 3]

methods:
  - timefill
  - locf
  - linear

baselines:
  edge_policy: train_feature_mean
  point_metrics: degenerate_k1
  point_k: 1

artifact_dir: artifacts/m7_5/bench

smoke:
  max_windows: null
  K_samples: 2
  solver_steps: 10
  split: val
