# Milestone 7.5 benchmark (WP7 Phase 3). Checkpoint under artifacts/m7_5/train/.
# Seed lists expand to a 3×3 Cartesian grid; writes metrics_by_rate.* (raw)
# plus metrics_summary.csv (mean±std). block.extra_lens = extension rows.
# Use --real-config configs/real_m7_5.yaml.

data:
  processed_dir: data/processed/m2
  checkpoint: artifacts/m7_5/train/checkpoints/best_score_net.eqx
  scaler: artifacts/m7_5/train/checkpoints/feature_scaler.npz
  split: test
  n_features: 6
  feature_names:
    - PM2.5
    - PM10
    - SO2
    - NO2
    - CO
    - O3
  seq_len: 64

protocols:
  mcar_rates:
    - 0.10
    - 0.30
    - 0.50
  block:
    enabled: true
    block_len: 8
    extra_lens: [16]

sample:
  K_samples: 50
  solver_steps: 100
  diffusion_impl: diagonal
  point_estimate: median

seeds:
  mask: [0, 1, 2]
  sample: [1, 2, 3]

methods:
  - timefill
  - locf
  - linear

baselines:
  edge_policy: train_feature_mean
  point_metrics: degenerate_k1
  point_k: 1

# Separate from thin claim dir (artifacts/m7_5/bench/) so a grid rerun cannot
# overwrite files cited in docs/m7_5_results.md.
artifact_dir: artifacts/m7_5/bench_grid

smoke:
  max_windows: null
  K_samples: 2
  solver_steps: 10
  split: val
