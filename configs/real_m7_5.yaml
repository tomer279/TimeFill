# Milestone 7.5 real-data training (new behavior; legacy stays in real_m2.yaml).
# Tensor contract unchanged: (B, T, F); m: 1=observed, 0=missing; sentinel 0.0.
# See ASSUMPTIONS.md (Milestone 7.5). Flags are parsed in WP0; consumers land
# in WP1–WP5. Artifacts go under artifacts/m7_5/train/ (never overwrite m2).
#
# WP7 wires model.* (tcn_v2) + sidecar; WP4/WP5 train flags already live.
# Hygiene train: legacy model + empty transform + WP4 train flags.

data:
  dataset_name: beijing_multisite_air_quality
  raw_dir: data/raw/beijing_multisite
  processed_dir: data/processed/m2
  raw_glob: "*.csv"
  seq_len: 64
  stride: 64
  n_features: 6
  feature_names:
    - PM2.5
    - PM10
    - SO2
    - NO2
    - CO
    - O3
  mask_rate: 0.3
  block_len: 8
  batch_size: 32
  split_mode: entity
  split_seed: 0
  train_fraction: 0.70
  val_fraction: 0.15
  test_fraction: 0.15
  scaler_filename: feature_scaler.npz
  allow_empty_feature_fallback: false
  transform:
    log1p_features:
      - PM2.5
      - PM10
      - SO2
      - NO2
      - CO
    clip_nonnegative: true

sde:
  beta_min: 0.1
  beta_max: 20.0
  T_diff: 1.0

model:
  arch: tcn_v2
  hidden_channels: 64
  dilations: [1, 2, 4, 8, 16, 32]
  kernel_size: 3
  time_embed_dim: 64
  time_embed_scale: 1000.0
  time_cond: per_block
  norm: group
  norm_groups: 8

train:
  lr: 0.0003
  epochs: 200
  weight_decay: 0.0001
  seed: 0
  t_eps: 1.0e-3
  obs_loss_weight: 0.0
  steps_per_epoch: 400
  val_every: 5
  log_every: 1
  grad_clip_norm: 1.0
  mask_mode: mixed
  parameterization: eps
  observed_input: clean
  mixed_select: per_window
  block_len_range: [4, 16]
  max_blocks_per_feature: 2
  ema_decay: 0.999
  lr_schedule: warmup_cosine
  warmup_steps: 1000
  select_by: val_impute_crps
  val_impute:
    n_windows: 64
    K_samples: 8
    solver_steps: 50
    mask_seed: 0
    sample_seed: 1
    protocols: [mcar_0.3, block_8]
  artifact_dir: artifacts/m7_5/train
  # Unused while select_by=val_impute_* (PNG hook skipped; see ASSUMPTIONS WP4).
  snapshot_k_samples: 4
  snapshot_solver_steps: 20
  sensitivity_mask_rates: null

sample:
  K_samples: 50
  solver_steps: 100
  t_eps: 1.0e-3
  observed_mode: frozen_clean
  diffusion_impl: diagonal
  point_estimate: median
