[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ct-diffusion-timeseries"
version = "0.1.0"
description = "Continuous-time (VP-SDE) score-based imputation for multivariate time series (JAX / Equinox / Diffrax)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tomer" },
]
keywords = [
    "diffusion",
    "score-matching",
    "time-series",
    "imputation",
    "jax",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.4.30",
    "equinox>=0.11.0",
    "diffrax>=0.5.0",
    "optax>=0.2.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pytest>=8.0",
]

[project.optional-dependencies]
# Streamlit product surface (M4). Core tests do not require this extra.
app = [
    "streamlit>=1.28",
    "plotly>=5.18",
]
# Optional CUDA install is platform-specific; see README (JAX docs).
# Example (do not pin blindly): pip install -U "jax[cuda12]"

[project.urls]
Homepage = "https://github.com/OWNER/REPO"
# Replace OWNER/REPO after you create the GitHub repository.

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]